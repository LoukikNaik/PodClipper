name: Publish to PyPI

# A new vX.Y.Z tag publishes X.Y.Z. Manual runs only build and validate.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Derive release version from tag
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          import os
          import re
          tag = os.environ["GITHUB_REF_NAME"]
          if not re.fullmatch(r"v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)", tag):
              raise SystemExit("Release tags must use vX.Y.Z, for example v0.1.0")
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"SETUPTOOLS_SCM_PRETEND_VERSION_FOR_PODCLIPPER={tag[1:]}\n")
          PY

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      # build creates the wheel from the sdist, exercising both distributions.
      - name: Build source distribution and wheel
        run: python -m build

      - name: Validate release metadata and contents
        run: |
          python -m twine check --strict dist/*
          python dev/check_release.py dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/podclipper
    permissions:
      id-token: write   # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI using Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
