# Agentic Video Editor — default configuration.
# Every module reads from here; CLI flags may override individual keys.

paths:
  output_dir: outputs
  cache_dir: .cache              # intermediate artifacts (audio, clips, transcripts) — enables resumability

audio:
  sample_rate: 16000             # Whisper-friendly
  codec: pcm_s16le               # uncompressed WAV for fastest decode
  chunk_seconds: 300             # first-pass chunk length (5 min)
  chunk_overlap_seconds: 10      # overlap for boundary safety

transcribe:
  engine: mlx                    # mlx (default, Apple-Silicon GPU, best quality) |
                                 # faster (faster-whisper CPU/CUDA). CLI: --whisper-engine
  language: null                 # null = auto-detect per clip (no episode-level pinning)
  retry_on_garble: true          # if auto-detect returns a suspiciously sparse transcript
                                 # (accented-English-heard-as-Hindi drops most words),
                                 # retry with fallback_languages and keep the fullest —
                                 # so we only force a language when auto actually failed
  garble_min_words_per_sec: 1.5  # below this word density = likely garbled → retry
  fallback_languages: ["en"]     # languages to try when auto looks garbled
  vad_filter: true               # drop non-speech (music/silence) via Silero VAD so
                                 # Whisper can't hallucinate repetition loops on it
                                 # ("gess gess gess"); also recovers speech it would
                                 # otherwise choke on at clip boundaries
  condition_on_previous_text: false  # don't feed prior text as prompt — stops one bad
                                 # guess cascading into a hallucinated loop
  first_pass:
    model: base                  # tiny | base | small | medium | large-v3
    compute_type: int8           # int8 (CPU), int8_float16 (MPS), float16 (GPU)
    device: auto                 # auto | cpu | cuda | mps
    max_workers: 4               # parallel chunk workers (ThreadPool)
    beam_size: 1                 # lower = faster, higher = more accurate
  second_pass:
    model: large-v3              # high-quality per-clip re-transcription
    compute_type: int8           # use "int8_float16" or "float16" only with CUDA GPU
    device: auto
    beam_size: 5                 # accuracy matters more here (subtitles)
    word_timestamps: true
  cleanup:                       # LLM post-processing of second-pass words
    enabled: true
    transliterate: true          # romanize non-Latin scripts (Hindi, Urdu, Arabic, ...)
    fix_spelling: true           # correct obvious whisper mis-transcriptions
    max_tokens_per_call: 2000    # safety cap

llm:
  provider: claude_cli           # claude_cli | litellm
  model: anthropic/claude-sonnet-4-5   # litellm format: '<vendor>/<model>'.
                                 # ignored by claude_cli (it picks its own).
                                 # Routing examples:
                                 #   anthropic/claude-sonnet-4-5    (direct Anthropic API)
                                 #   openai/gpt-5-mini              (direct OpenAI API)
                                 #   ollama/llama3                  (local, needs api_base)
                                 #   openai/anthropic/claude-sonnet-4.5
                                 #     ↑ via OpenAI-compatible gateway (TokenRouter,
                                 #       OpenRouter, ...). 'openai/' = speak OAI proto;
                                 #       rest is the upstream model string.
  max_tokens: 4096
  claude_cli:
    binary: claude               # path to CLI; "claude" uses $PATH
    extra_args: []
  litellm:
    api_base: null               # set for gateways or local runtimes, e.g.
                                 #   https://api.tokenrouter.com/v1
                                 #   http://localhost:11434             (ollama)
                                 # null → use vendor's default endpoint.
    api_key_env: null            # null → litellm reads the env var matching the model
                                 # prefix (anthropic/ → ANTHROPIC_API_KEY,
                                 # openai/ → OPENAI_API_KEY, ...). Override when
                                 # using a gateway: set to e.g. TOKENROUTER_API_KEY.
    timeout_seconds: 900
    num_retries: 2

analyze:
  min_clip_seconds: 15
  max_clip_seconds: 90
  target_clips: 8                # hint to the LLM; it may return fewer/more
  source_limit_seconds: null     # null = whole video; N = only consider the
                                 # first N seconds for clip selection (skips
                                 # transcribing the rest). CLI: --limit-minutes
  transcript_timestamp_resolution: seconds    # "seconds" → [MM:SS] prefixes
  refine_bounds: true            # after the LLM picks clips and we snap to
                                 # segment boundaries, do ONE MORE per-clip
                                 # LLM call to find the exact first/last word
                                 # that makes the clip play as a complete
                                 # idea. Eliminates the "starts mid-thought"
                                 # and "cuts off before the payoff" failures
                                 # that mechanical segment-snap produces.
                                 # Adds one extra LLM call per clip (~5-30s).
  refiner_window_s: 10.0         # ±seconds of word-level context shown to
                                 # the refiner around the clip on each side

clip_extract:
  pad_seconds: 0.15              # tiny buffer on each side of the (refined,
                                 # word-precise) clip bounds. The LLM refiner
                                 # already lands on actual word boundaries —
                                 # anything more than ~0.15s pulls in audio
                                 # from the neighboring sentence (show intro
                                 # tags, lead-ins to the next topic, etc.).
  video_codec: libx264
  crf: 18                        # visually lossless-ish for intermediate
  preset: medium

detect:
  model: yolov8n.pt              # nano weights; downloaded on first use
  device: auto
  confidence: 0.35
  iou: 0.5
  sample_every_n_frames: 1       # 1 = every frame; bump for speed
  person_class_id: 0
  face_aware: true               # run MediaPipe face detection inside the person bbox
                                 # and use the face center for cropping — prevents the
                                 # crop from drifting to hands/torso during gestures
  debug_overlay: false           # write debug_detect.mp4 and debug_mouth.mp4 per clip
                                 # showing front/back face labels + mouth-openness boxes

crop:
  mode: auto                     # auto: shot-aware (single ↔ stacked dual-panel)
                                 # single: DEPRECATED legacy follow-the-speaker
                                 #   crop (uses diarize + timeline). Kept for
                                 #   single-locked-camera podcasts only.
  target_width: 1080
  target_height: 1920
  smoothing_alpha: 0.1           # DEPRECATED — single-mode EMA for x-center within a segment
  min_segment_dwell_seconds: 0.8 # DEPRECATED — single-mode min segment length
  debug_overlay: false
  ffmpeg_encoder: libx264
  ffmpeg_crf: 20
  ffmpeg_preset: medium
  # Shot classifier (auto mode): when a frame has ≥2 person bboxes that are
  # each <height_cap_frac of source height AND separated by >=sep_frac of
  # source width, the frame is "wide" and gets stacked dual-panel rendering.
  shot_sep_frac: 0.20
  shot_min_person_frac: 0.20      # a person counts toward a two-shot only if TALLER
                                  # than this fraction of frame height — ignores tiny
                                  # background people / wall posters. Two real people
                                  # (above the floor) + separated → stack, regardless of
                                  # how big they are.
  shot_height_cap_frac: 1.0       # optional upper bound (1.0 = off). Was a "wide shots
                                  # only" heuristic that wrongly skipped seated two-shots.
  shot_smooth_window_frames: 15   # 0.5s @ 30fps; majority rule for shot-type
  shot_min_dwell_frames: 0        # 0 = stack as soon as a two-shot appears (any
                                  # duration); raise to require the two-shot to
                                  # persist N frames before switching layout
  # Per-panel framing (auto mode): pose-anchored crop with body-bbox IoU
  # hysteresis. Crop bbox stays locked while body IoU >= threshold; only
  # updates when the speaker actually moves enough.
  stacked_iou_threshold: 0.50     # lower = crop holds through gestures/leans (less
                                  # twitchy re-framing); only real movement re-frames
  snap_cut_iou: 0.15              # below this body-overlap the change is a source cut
                                  # (person jumped) → snap the crop instantly instead
                                  # of gliding (a glide after a cut reads as shake)
  stacked_miss_tolerance: 15      # hold lock during up to N consecutive misses
  stacked_snap_px: 8              # snap crop dims to multiples of this for stability
  stacked_top_is_right: false     # false: leftmost person in top panel; true: rightmost
  stacked_transition_frames: 16   # when lock breaks, lerp crop bbox over this many
                                  # frames (~0.4s @ 30fps). Higher = smoother but
                                  # slower to settle on a new framing. Set to 1 for
                                  # the old hard-cut behavior.
  intro_zoom:                     # opt-in "dopamine" hook: first frames start
                                  # punched-in on the subject and ease out to the
                                  # normal framing. CLI: --intro-zoom
    enabled: false
    duration_seconds: 0.7         # how long the pull-out takes
    max_zoom: 1.35                # starting zoom factor (1.0 = no zoom)

subtitles:
  style: "classic"               # "classic" = current karaoke line; "pop" = 1-2 huge words at a time
  font_name: "Arial"
  font_size: 72
  primary_color: "&H00FFFFFF"    # white (BGR in ASS format)
  highlight_color: "&H0000FFFF"  # yellow accent for current word
  outline_color: "&H00000000"
  outline_width: 3
  shadow: 1
  margin_v: 360                  # from bottom; positions subs in lower third of 1920px frame
  max_chars_per_line: 20
  fade_out_seconds: 0.6          # fade video to black + fade audio out over the last N seconds
  title_overlay:
    enabled: true
    duration_seconds: 3.5        # total time the title is on screen (fade-out included)
    fade_seconds: 0.7            # length of the fade-out at the end
    font_size: 96                # large bold — must be readable in < 1 second
    max_chars_per_line: 18       # forces 2-line wrap for punch; short lines hit harder
    y_offset: 200                # pixels from top — sits in the safe zone below status bar
    line_spacing: 16
    color: "&H00FFFFFF"          # white text
    outline_color: "&H00000000"  # black outline for contrast on any background
    outline_width: 6
    pill_enabled: false          # disabled — using gradient backdrop instead (cleaner)
    pill_color: "&HA0000000"
    pill_padding_x: 40
    pill_padding_y: 20
    pill_corner_radius: 28
    gradient_enabled: true       # dark gradient at top 30% of frame for text readability
    gradient_opacity: 0.55       # semi-transparent dark sweep
  pop:                           # only consulted when subtitles.style == "pop"
    font_size: 140               # pop captions are huge — fills ~half the frame width
    outline_width: 6             # heavy black outline for readability over any background
    highlight_colors:            # active word cycles through these per popup (red, green) for stimulation
      - "&H003344FF"             # red/orange (BGR in ASS)
      - "&H0033DD33"             # green
    scale: 1.08                  # active-word scale-up factor
    shear_deg: 8.0               # italic skew applied to all words
    max_words_per_popup: 2       # 1 = strictly one word at a time; 2 = pair when short
    y_position_frac: 0.72        # vertical anchor as fraction of frame height (0=top, 1=bottom)
                                  # 0.72 = lower-middle (TikTok zone). Override via config.
    max_gap_seconds: 0.6         # inter-word gap that forces a flush

diarize:                         # DEPRECATED — only consulted by `crop.mode: single`.
                                 # pyannote-driven multi-speaker follow-the-speaker crop.
  enabled: true                  # requires HF_TOKEN in .env (see .env.example)
  hf_token_env: HF_TOKEN
  model: pyannote/speaker-diarization-3.1
  min_speakers: null
  max_speakers: null

# Trailer mode (--mode trailer): pick 4-5 quotable sentences from across the
# episode and splice them into one short trailer-style reel with brief black
# transitions between cuts.
trailer:
  gap_seconds: 0.6               # duration of the black + silent gap between picks
  head_pad: 0.10                 # buffer before the first spoken word of each cut
  tail_pad: 0.10                 # buffer after the last spoken word of each cut
  audio_fade_in_s: 0.08          # smooth cold-cut audio entry
  audio_fade_out_s: 0.30         # smooth fade into the next black gap
  refiner_window_s: 10.0         # ±seconds of word-level context shown to the
                                 # refinement LLM call (where the speaker
                                 # actually finishes the thought)
  seg_out_fps: 30                # output framerate for the stitched trailer

music:                           # opt-in background music from a curated library.
                                 # A separate LLM call matches each reel to a
                                 # track by vibe (falls back to random). CLI: --music
  enabled: false
  library_path: music/library.json
  gain: 0.32                     # music bed level (0..1); kept well under speech
  duck_ratio: 3.0                # sidechain compression ratio (higher = music dips
                                 # more when the speaker talks)
  duck_threshold: 0.04           # speech level that triggers ducking
  duck_release: 450              # ms for music to swell back after speech (slow =
                                 # smooth, avoids pumping)
  fade_seconds: 0.8              # music fade-in and fade-out length

evaluate:
  enabled: true                  # run LLM-as-judge after each reel is rendered
  auto_skip: false               # if true, reels with verdict "skip" are moved to skipped/ dir
  skip_threshold: 3.0            # overall content score below this → "skip"
  publish_threshold: 4.0         # overall content score at/above this → "publish"

logging:
  level: INFO
  show_progress: true
