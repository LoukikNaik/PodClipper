[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "podclipper"
version = "0.1.0"
description = "Local-first pipeline that turns long-form podcast videos into short vertical reels."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [
    { name = "Loukik Naik", email = "loukiknaik@gmail.com" },
]
keywords = ["video", "podcast", "reels", "shorts", "whisper", "llm", "ffmpeg"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

dependencies = [
    "faster-whisper>=1.1.0",
    "ultralytics>=8.3.0",
    "opencv-python>=4.10",
    "numpy>=1.26",
    "Pillow>=10.0",
    "litellm>=1.50",
    "anthropic>=0.42.0",
    "mediapipe>=0.10",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
# Multi-speaker diarization (single-camera interviews). Heavy: ~5 GB.
# Install with: pip install podclipper[diarize]
diarize = [
    "pyannote.audio>=3.1",
    "torch>=2.0",
]
# Apple Silicon mlx-whisper backend. Install with: pip install podclipper[mlx]
# Enable per-run with `--whisper-engine mlx_whisper`.
mlx = [
    "mlx-whisper>=0.4",
]
# Dev / test
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "pytest-cov>=5.0",
]

[project.scripts]
podclipper = "podclipper.main:main"

[project.urls]
Homepage = "https://github.com/LoukikNaik/PodClipper"
Repository = "https://github.com/LoukikNaik/PodClipper"
"Demo site" = "https://podclipper.loukik.dev"

[tool.setuptools.packages.find]
where = ["src"]
include = ["podclipper*"]

[tool.setuptools.package-data]
podclipper = ["config/*.yaml", "prompts/*.txt"]
